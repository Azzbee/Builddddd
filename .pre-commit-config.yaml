# Run `pre-commit install` once, then checks run on every commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff (format check)
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd backend && uv run mypy lattice'
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (offline)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
