[project]
name = "lattice"
version = "0.1.0"
description = "Lattice: a living knowledge graph for scientific literature"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adam Zeraiki", email = "adamzeraiki@gmail.com" }]

# Core dependencies are intentionally light so the pure-logic core (similarity,
# extraction schema, chunker, dedup, entity resolution, eval harness, RAG router)
# is importable and testable without GPUs, Neo4j, or network access. Heavier
# integrations live in optional extras below.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.4",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "structlog>=24.1",
    "anyio>=4.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "arq>=0.26",
    "redis>=5.0",
]
db = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "neo4j>=5.20",
    "sqlalchemy>=2.0",
]
llm = [
    "litellm>=1.40",
    "anthropic>=0.30",
]
parsing = [
    "docling>=2.0",
    "lxml>=5.2",
    "pypdf>=4.2",
]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
observability = [
    "prometheus-client>=0.20",
    "langfuse>=2.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-python-dateutil>=2.9",
    "lxml>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lattice", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# Heavy optional integrations are import-guarded; don't fail when extras absent.
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (neo4j, postgres, grobid)",
]
