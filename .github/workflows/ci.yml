name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra api
      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Mypy
        run: uv run mypy lattice
      - name: Pytest
        run: uv run pytest --cov=lattice --cov-report=term-missing --cov-fail-under=85
      - name: Audit every locked Python extra
        run: |
          uv export --locked --all-extras --no-emit-project --output-file /tmp/lattice-requirements.txt
          uv run pip-audit --disable-pip --require-hashes --requirement /tmp/lattice-requirements.txt

  eval:
    name: Evals (extraction / retrieval / edge quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv sync --locked --extra dev
      - name: Run eval harness (offline, deterministic backends)
        run: uv run python ../scripts/run_eval.py --ci

  integration:
    name: Integration (pgvector + neo4j)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice"
          --health-interval 10s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/lattice-dev-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      LATTICE_TEST_PG_DSN: postgresql://lattice:lattice@localhost:5432/lattice
      LATTICE_TEST_NEO4J_URI: bolt://localhost:7687
      LATTICE_TEST_NEO4J_USER: neo4j
      LATTICE_TEST_NEO4J_PASSWORD: lattice-dev-password
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      # api extra is needed because pytest imports all test modules during
      # collection (test_api/test_demo import FastAPI) before -m filtering.
      - run: uv sync --locked --extra dev --extra db --extra api
      - name: Run live integration tests
        run: uv run pytest -m integration -v

  web:
    name: Web (format, lint, test, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Build production container
        run: docker build --tag lattice-web:ci .
