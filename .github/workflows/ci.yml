name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra api
      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Mypy
        run: uv run mypy lattice
      - name: Pytest
        run: uv run pytest --cov=lattice --cov-report=term-missing --cov-fail-under=85
      - name: Audit every locked Python extra
        run: |
          uv export --locked --all-extras --no-emit-project --output-file /tmp/lattice-requirements.txt
          uv run pip-audit --disable-pip --require-hashes --requirement /tmp/lattice-requirements.txt
      - name: Build production container
        run: docker build --tag lattice-backend:ci .
      - name: Validate Compose configuration
        working-directory: .
        run: LATTICE_ENV_FILE=.env.example docker compose config --quiet

  eval:
    name: Evals (extraction / retrieval / edge quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv sync --locked --extra dev
      - name: Run eval harness (offline, deterministic backends)
        run: uv run python ../scripts/run_eval.py --ci

  integration:
    name: Integration (pgvector + neo4j)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice"
          --health-interval 10s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/lattice-dev-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      LATTICE_TEST_PG_DSN: postgresql://lattice:lattice@localhost:5432/lattice
      LATTICE_TEST_NEO4J_URI: bolt://localhost:7687
      LATTICE_TEST_NEO4J_USER: neo4j
      LATTICE_TEST_NEO4J_PASSWORD: lattice-dev-password
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      # api extra is needed because pytest imports all test modules during
      # collection (test_api/test_demo import FastAPI) before -m filtering.
      - run: uv sync --locked --extra dev --extra db --extra api
      - name: Run live integration tests
        run: uv run pytest -m integration -v

  e2e:
    name: E2E (live GROBID + LLM when keyed)
    runs-on: ubuntu-latest
    # Its failure mode is "GROBID accepts the port but stalls"; without this the
    # default is six hours of billed runner time.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Same image/tag as docker-compose.yml, so CI verifies what ships.
      # No container healthcheck: the image has no curl (which is why
      # docker-compose.yml resorts to a bash /dev/tcp probe), and a healthcheck
      # that cannot execute is reported unhealthy immediately, failing the job
      # before a step ever runs. Readiness is waited for from the runner below,
      # where curl exists and a timeout produces a readable log.
      grobid:
        image: lfoppiano/grobid:0.8.1
        ports:
          - 8070:8070
        env:
          # GROBID 0.8.1 ships a JDK whose cgroup v2 detection cannot read the
          # runner's cgroup layout: it dies at startup with
          # "Cannot invoke CgroupInfo.getMountPoint() because anyController is
          # null" before binding a port. Turning off container support skips that
          # code path entirely; the JVM then sizes itself from host memory, which
          # is what a dedicated runner has anyway.
          JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    env:
      LATTICE_E2E_GROBID_URL: http://localhost:8070
      # A live model run must never be able to spend real money on a bad loop.
      LATTICE_COST__PER_JOB_USD_CAP: "0.10"
      LATTICE_COST__DAILY_USD_CAP: "1.00"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv sync --locked --extra dev --extra api --extra llm
      - name: Wait for GROBID
        run: |
          container=$(docker ps --all --quiet --filter ancestor=lfoppiano/grobid:0.8.1 | head -1)
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8070/api/isalive; then
              echo "GROBID ready after ${attempt} attempt(s)"
              curl --silent http://localhost:8070/api/version || true
              exit 0
            fi
            # A dead container will never become ready; say why now rather than
            # burning five minutes and reporting a bare timeout.
            if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
              echo "GROBID exited before serving:"
              docker logs --tail 40 "$container"
              exit 1
            fi
            sleep 5
          done
          echo "GROBID never became ready"
          [ -n "$container" ] && docker logs --tail 40 "$container"
          exit 1
      # Job-level `if:` cannot read secrets, so the gate is a step output.
      # No key (including every fork PR) still runs the GROBID leg and passes.
      - name: Detect a model key
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANTHROPIC_API_KEY secret; running the GROBID leg only."
          fi
      - name: Live GROBID end to end (no key needed)
        run: uv run pytest -m e2e -v
      - name: Live GROBID + live model end to end
        if: steps.gate.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LATTICE_E2E_LLM_MODEL: claude-haiku-4-5-20251001
        run: uv run pytest -m e2e -v

  web:
    name: Web (format, lint, test, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Build production container
        run: docker build --tag lattice-web:ci .
      - name: Smoke-test production container
        run: |
          docker run --detach --name lattice-web-ci --publish 3300:3000 lattice-web:ci
          trap 'docker rm --force lattice-web-ci' EXIT
          for attempt in {1..20}; do
            curl --fail --silent --head http://127.0.0.1:3300/ > /tmp/web-headers.txt && break
            sleep 1
          done
          grep --ignore-case '^content-security-policy:' /tmp/web-headers.txt
          if grep --ignore-case '^x-powered-by:' /tmp/web-headers.txt; then
            echo "production server disclosed the framework"
            exit 1
          fi
