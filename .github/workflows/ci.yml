name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install dependencies
        run: uv pip install -e ".[dev,api]"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy lattice
      - name: Pytest
        run: uv run pytest --cov=lattice --cov-report=term-missing

  eval:
    name: Evals (extraction / retrieval / edge quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Run eval harness (offline, deterministic backends)
        run: uv run python ../scripts/run_eval.py --ci

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build
