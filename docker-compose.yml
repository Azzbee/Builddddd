name: lattice

services:
  neo4j:
    image: neo4j:5.23-community
    environment:
      NEO4J_AUTH: neo4j/${LATTICE_NEO4J__PASSWORD:-lattice-dev-password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: lattice
      POSTGRES_DB: lattice
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/lattice/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8070; printf \"GET /api/isalive HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn lattice.api.app:app --host 0.0.0.0 --port 8000
    env_file: ${LATTICE_ENV_FILE:-.env}
    environment:
      LATTICE_PERSISTENT: "true"  # the full stack has Postgres + Neo4j available
    ports:
      - "8000:8000"
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      grobid: { condition: service_started }

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq lattice.worker.WorkerSettings
    healthcheck:
      test: ["CMD", "arq", "lattice.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    env_file: ${LATTICE_ENV_FILE:-.env}
    environment:
      LATTICE_PERSISTENT: "true"
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      LATTICE_API_BASE: http://api:8000
      LATTICE_AUTH_TOKEN: ${LATTICE_AUTH_TOKEN:-}
      LATTICE_PROXY_MAX_BODY_MB: ${LATTICE_PROXY_MAX_BODY_MB:-52}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  neo4j_data:
  pg_data:
